spring:
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_log}
    username: ${AUDIT_DB_USERNAME:audit_service}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration/postgresql
  h2:
    console:
      enabled: false
